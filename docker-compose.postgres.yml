# PostgreSQL variant — use this if you prefer an external database.
# Usage: docker compose -f docker-compose.postgres.yml up -d
services:
  ledgr:
    build: .
    container_name: ledgr
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    # Every variable in .env reaches the container (Authentik, TZ,
    # LEDGR_BACKUP_DIR, ALLOWED_ACTUAL_HOSTS, …); see .env.example.
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ledgr}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      # Required: compose refuses to start, naming the variable, until set.
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env (openssl rand -base64 32)}
      - CRON_SECRET=${CRON_SECRET:?set CRON_SECRET in .env (openssl rand -base64 32)}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      # See docker-compose.yml / .env.example — set to your household's
      # local timezone. Defaults to UTC (pre-existing behavior).
      - TZ=${TZ:-UTC}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: ledgr-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-ledgr}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ledgr}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_READ_SEARCH

volumes:
  pgdata:
