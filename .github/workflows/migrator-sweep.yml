name: Migrator sweep

# The two migrator replay suites sample their journal points on every
# `pnpm test` (tests/helpers/journal-sample.ts: first, last and four seeded
# others, the seed printed). This weekly run on main sweeps every point.
# It is outside ci.yml on purpose: scripts/ci-gate.ts reads only ci.yml.
on:
  schedule:
    - cron: "0 15 * * 1" # Mondays 15:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: Every journal point replays
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Both replay suites at every journal point
        run: pnpm test tests/db/v090-squash-upgrade.test.ts tests/db/sqlite-replay-recreate.test.ts
        env:
          LEDGR_FULL_MIGRATOR_SWEEP: "1"
