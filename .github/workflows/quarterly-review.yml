name: Quarterly Review

on:
  schedule:
    # First Monday of Jan, Apr, Jul, Oct at 9am UTC
    - cron: "0 9 1-7 1,4,7,10 1"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  create-review-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Collect review data
        id: data
        run: |
          # File size check
          SIZE_OUTPUT=$(pnpm -s check:file-size 2>&1 || true)
          LARGEST_FILES=$(node -e 'const b = require("./size-baseline.json"); console.log(Object.entries(b.files).sort((x, y) => y[1] - x[1]).slice(0, 15).map(([f, n]) => "- `" + f + "` " + n).join("\n"))')

          # Pending major dependabot PRs
          MAJOR_PRS=$(gh pr list --state open --label "dependencies" --json title,url \
            --jq '.[] | "- [\(.title)](\(.url))"' 2>/dev/null || echo "- _(unable to fetch)_")

          # Lint: pass or fail, and the suppressed cases the ratchet files hold
          if pnpm -s lint >/dev/null 2>&1; then LINT_STATUS="passes"; else LINT_STATUS="FAILS"; fi
          LINT_COUNTS='const t = {}; for (const f of ["eslint-suppressions.json", "eslint-suppressions-typed.json"]) for (const rules of Object.values(require("./" + f))) for (const [r, { count }] of Object.entries(rules)) t[r] = (t[r] ?? 0) + count;'
          LINT_COUNT=$(node -e "$LINT_COUNTS console.log(Object.values(t).reduce((a, b) => a + b, 0))")
          LINT_BREAKDOWN=$(node -e "$LINT_COUNTS for (const [r, n] of Object.entries(t).sort((a, b) => b[1] - a[1]).slice(0, 10)) console.log(String(n).padStart(6) + ' ' + r)")

          # Dependency audit
          AUDIT_OUTPUT=$(pnpm audit --audit-level=high 2>&1 || true)
          AUDIT_SUMMARY=$(echo "$AUDIT_OUTPUT" | grep "vulnerabilities found" || echo "0 vulnerabilities found")

          # Docs freshness
          DOCS_OUTPUT=$(pnpm docs:verify 2>&1 || true)

          # LOC trend — src/ vs tests/, compared against the last quarterly issue
          SRC_LOC=$(find src -type f \( -name "*.ts" -o -name "*.tsx" \) | xargs wc -l | tail -1 | awk '{print $1}')
          TESTS_LOC=$(find tests -type f \( -name "*.ts" -o -name "*.tsx" \) | xargs wc -l | tail -1 | awk '{print $1}')
          PREV_ISSUE_BODY=$(gh issue list --label maintenance --state all --limit 5 \
            --json title,body --jq '[.[] | select(.title | startswith("Quarterly review"))][0].body' 2>/dev/null || echo "")
          PREV_SRC_LOC=$(echo "$PREV_ISSUE_BODY" | grep -oE 'src/ LOC: [0-9]+' | grep -oE '[0-9]+' || echo "")
          if [ -n "$PREV_SRC_LOC" ]; then
            LOC_DELTA=$((SRC_LOC - PREV_SRC_LOC))
            LOC_TREND="src/ LOC: $SRC_LOC (was $PREV_SRC_LOC last quarter, $([ $LOC_DELTA -ge 0 ] && echo "+$LOC_DELTA" || echo "$LOC_DELTA"))"
          else
            LOC_TREND="src/ LOC: $SRC_LOC (no prior quarterly issue found to compare against)"
          fi

          # Save to env
          {
            echo "SIZE_OUTPUT<<EOF"
            echo "$SIZE_OUTPUT"
            echo "EOF"
            echo "LARGEST_FILES<<EOF"
            echo "$LARGEST_FILES"
            echo "EOF"
            echo "MAJOR_PRS<<EOF"
            echo "$MAJOR_PRS"
            echo "EOF"
            echo "LINT_STATUS<<EOF"
            echo "$LINT_STATUS"
            echo "EOF"
            echo "LINT_COUNT<<EOF"
            echo "$LINT_COUNT"
            echo "EOF"
            echo "LINT_BREAKDOWN<<EOF"
            echo "$LINT_BREAKDOWN"
            echo "EOF"
            echo "AUDIT_SUMMARY<<EOF"
            echo "$AUDIT_SUMMARY"
            echo "EOF"
            echo "AUDIT_OUTPUT<<EOF"
            echo "$AUDIT_OUTPUT"
            echo "EOF"
            echo "DOCS_OUTPUT<<EOF"
            echo "$DOCS_OUTPUT"
            echo "EOF"
            echo "LOC_TREND<<EOF"
            echo "$LOC_TREND"
            echo "EOF"
            echo "TESTS_LOC<<EOF"
            echo "$TESTS_LOC"
            echo "EOF"
          } >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create review issue
        run: |
          gh issue create \
            --title "Quarterly review — $(date +%B\ %Y)" \
            --label "maintenance" \
            --body "$(cat <<ISSUE_BODY
          ## Quarterly Review Checklist

          ### Size Baseline

          \`size-baseline.json\` only goes down. Pick the next splits from the largest recorded files.

          **Largest recorded files:**
          $LARGEST_FILES

          <details>
          <summary>Full file size report</summary>

          \`\`\`
          $SIZE_OUTPUT
          \`\`\`
          </details>

          ### ESLint ratchet

          \`pnpm lint\` $LINT_STATUS. **$LINT_COUNT suppressed cases** in \`eslint-suppressions.json\` and \`eslint-suppressions-typed.json\` (counts only go down).

          <details>
          <summary>Suppressed cases by rule (top 10)</summary>

          \`\`\`
          $LINT_BREAKDOWN
          \`\`\`
          </details>

          - [ ] Pick the next rule to clean up from the top of the list
          - [ ] Target: fewer suppressed cases quarter-over-quarter

          ### Dependency Audit

          **$AUDIT_SUMMARY**

          <details>
          <summary>Full audit output</summary>

          \`\`\`
          $AUDIT_OUTPUT
          \`\`\`
          </details>

          - [ ] Address any new high/critical vulnerabilities
          - [ ] Review if deferred major upgrades (Next.js, ESLint, Tailwind) resolve existing vulns

          ### Major Dependency Updates

          Review open dependabot PRs for major version bumps. Test and merge or close with justification.

          $MAJOR_PRS

          ### Codebase Size Trend

          $LOC_TREND
          tests/ LOC: $TESTS_LOC

          - [ ] If src/ LOC grew significantly faster than shipped features this quarter, worth a look — otherwise no action needed. Raw growth isn't itself a problem.

          ### Docs Freshness

          <details>
          <summary>Docs verification output</summary>

          \`\`\`
          $DOCS_OUTPUT
          \`\`\`
          </details>

          - [ ] Fix any stale auto-generated docs

          ### Housekeeping

          - [ ] Pick the next split from \`size-baseline.json\` (a split names a concept per part)
          - [ ] Review open major dependency PRs — merge, close, or defer with reason
          - [ ] Check Docker image size (\`docker images ledgr\`) — flag if significantly larger
          - [ ] Review CI pipeline — any steps consistently slow or failing?
          - [ ] Review non-blocking CI steps — are any ready to become blocking?

          ---
          _Auto-generated by the quarterly-review workflow._
          ISSUE_BODY
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
