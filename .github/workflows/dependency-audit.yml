name: Dependency audit

# A high or critical advisory in a production dependency fails this weekly
# run on main while it stands (owner Q5). CI's audit job blocks only pull
# requests into main and reports on pushes. Outside ci.yml on purpose:
# scripts/ci-gate.ts reads only ci.yml, so a new advisory never blocks a
# deploy by itself.
on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: No high advisory in production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Dependency audit (production, high and above)
        run: pnpm audit --prod --audit-level=high
