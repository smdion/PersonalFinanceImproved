name: Tax data freshness

# CI's tax-params step blocks only a change to the tax data or its tables,
# so this weekly run on main is what fails while a published year is
# missing (TAX-PARAMETER-RUNBOOK.md). It is outside ci.yml on purpose:
# scripts/ci-gate.ts reads only ci.yml, so a stale year never blocks a deploy.
on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tax-params:
    name: Tax data is current
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Every published tax year is in tax-data/
        run: pnpm check:tax-params
