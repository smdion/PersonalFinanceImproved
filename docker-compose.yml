# Default: SQLite (no external database required)
# For PostgreSQL, see docker-compose.postgres.yml
services:
  ledgr:
    build: .
    container_name: ledgr
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    # Every variable in .env reaches the container (Authentik, TZ,
    # LEDGR_BACKUP_DIR, ALLOWED_ACTUAL_HOSTS, …); see .env.example.
    env_file:
      - path: .env
        required: false
    environment:
      # No DATABASE_URL = SQLite mode (zero config).
      # Set DATABASE_URL=postgresql://... for PostgreSQL.
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      # Required: compose refuses to start, naming the variable, until set.
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env (openssl rand -base64 32)}
      - CRON_SECRET=${CRON_SECRET:?set CRON_SECRET in .env (openssl rand -base64 32)}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      # Set to your household's local timezone (e.g. America/Chicago) so
      # server-side date math (year-end snapshots, paycheck/budget
      # materializers) agrees with the browser UI near local midnight —
      # see .env.example. Defaults to UTC (pre-existing behavior).
      - TZ=${TZ:-UTC}
    volumes:
      - ledgr_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

volumes:
  ledgr_data:
